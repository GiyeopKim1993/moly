name: Update Dropbox installer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  update-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Download the current Dropbox Mac installer
        id: download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dropbox-release"
          url="https://www.dropbox.com/download?plat=mac&full=1"
          curl --fail --silent --show-error --location "$url" \
            --output "$RUNNER_TEMP/dropbox-release/DropboxInstaller.dmg" \
            --write-out '%{url_effective}' > "$RUNNER_TEMP/dropbox-release/source-url.txt"
          if [[ ! -s "$RUNNER_TEMP/dropbox-release/DropboxInstaller.dmg" ]]; then
            echo "Dropbox returned an empty installer." >&2
            exit 1
          fi
          sha256sum "$RUNNER_TEMP/dropbox-release/DropboxInstaller.dmg" \
            | cut -d ' ' -f 1 > "$RUNNER_TEMP/dropbox-release/SHA256.txt"
          echo "source_url=$(cat "$RUNNER_TEMP/dropbox-release/source-url.txt")" >> "$GITHUB_OUTPUT"

      - name: Create or refresh the latest installer release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="dropbox-latest"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest Dropbox for Mac" \
              --notes "Automatically refreshed from Dropbox's official Mac download endpoint every Monday. Source download: https://www.dropbox.com/download?plat=mac&full=1"
          fi
          gh release delete-asset "$tag" DropboxInstaller.dmg \
            --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release delete-asset "$tag" SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release upload "$tag" \
            "$RUNNER_TEMP/dropbox-release/DropboxInstaller.dmg" \
            "$RUNNER_TEMP/dropbox-release/SHA256.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "Latest Dropbox for Mac"
